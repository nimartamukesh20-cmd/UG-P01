<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Graveyard Stroll</title>
    <link rel="stylesheet" href="haunted-harvest.css">
</head>

<body>
    <!-- SCENE 1: ENTERING GRAVEYARD-->
<section id="scene1" class="scene entrance-scene">

    <h2>Chapter 1: Enter the Graveyard</h2>

    <div class="sky entrance-sky">
        <div class="moon" aria-hidden="true"></div>
        <div class="cloud cloud-one" aria-hidden="true"></div>
        <div class="cloud cloud-two" aria-hidden="true"></div>
    </div>

    <div class="graveyard entrance-yard">

        <div class="cemetery-gate">
            <div class="gate-sign">MIDNIGHT CEMETERY</div>
            <div class="gate-left"></div>
            <div class="gate-right"></div>
        </div>

        <div class="fence fence-left"></div>
        <div class="fence fence-right"></div>

        <div class="gravestone grave-one">
            RIP
            <span class="hidden-ghost">👻</span>
        </div>

        <div class="gravestone grave-two">
            RIP
            <span class="hidden-ghost">👻</span>
        </div>

        <div class="couple">🚶‍♀️🚶</div>
        <img src="images/black_cat.png" alt="Black Cat" class="black-cat">
        <img src="images/ghost.png" alt="Ghost" class="scene1-ghost">

        <div class="fog fog-one"></div>

    </div>

    <a class="next-button" href="#scene2">Enter the Cemetery →</a>

</section>

<!-- SCENE 2: DEEP IN THE GRAVEYARD -->
<section id="scene2" class="scene deep-scene">

    <h2>Chapter 2: Deep in the Graveyard</h2>

    <div class="sky deep-sky">
        <div class="moon moon-left" aria-hidden="true"></div>
        <div class="cloud cloud-three" aria-hidden="true"></div>
    </div>

    <div class="graveyard deep-yard">

        <div class="gravestone deep-grave grave-a">
            RIP
            <span class="hidden-ghost">👻</span>
        </div>

        <div class="gravestone deep-grave grave-b">
            1892
            <span class="hidden-ghost">👻</span>
        </div>

        <div class="gravestone deep-grave grave-c">
            RIP
            <span class="hidden-ghost">👻</span>
        </div>

        <div class="gravestone deep-grave grave-d">
            1913
            <span class="hidden-ghost">👻</span>
        </div>

        <div class="gravestone deep-grave grave-e">
            RIP
            <span class="hidden-ghost">👻</span>
        </div>

        <div class="ghost-orb orb-one"></div>
        <div class="ghost-orb orb-two"></div>
        <div class="ghost-orb orb-three"></div>

        <div class="cyclist">🚴</div>

        <div class="couple couple-two">🚶‍♀️🚶</div>
        <img src="images/black_cat.png" alt="Black Cat" class="black-cat cat-two">
        <img src="images/zombie.png" alt="zombie" class="zombie">


        <div class="fog fog-two"></div>
        <div class="fog fog-three"></div>

    </div>

    <div class="scene-buttons">
        <a class="next-button" href="#scene1">← Entrance</a>
        <a class="next-button" href="#scene3">Follow the Path →</a>
    </div>

</section>


<!-- SCENE 3: HAUNTED PATH -->
<section id="scene3" class="scene forest-scene">

    <h2>Chapter 3: The Haunted Path</h2>

    <div class="sky forest-sky">
        <div class="small-moon" aria-hidden="true"></div>
        <div class="cloud cloud-four"></div>
    </div>

    <div class="graveyard forest-yard">

        <img src="images/skeleton_tree.png" alt="Skeleton hanging from tree" class="tree-img skeleton-tree">
        <img src="images/spooky_tree.png" alt="Spooky Tree" class="tree-img spooky-tree">

        <div class="haunted-path"></div>

        <div class="chapel">
            <div class="chapel-roof"></div>
            <div class="chapel-window">✝</div>
            <div class="chapel-door"></div>
        </div>

        <div class="floating-ghost ghost-one">👻</div>
        <div class="floating-ghost ghost-two">👻</div>

        <div class="couple couple-three">🚶‍♀️🚶</div>
        <img src="images/black_cat.png" alt="Black Cat" class="black-cat cat-three">

        <div class="fog forest-fog-one"></div>
        <div class="fog forest-fog-two"></div>

    </div>

    <div class="scene-buttons">
        <a class="next-button" href="#scene2">← Graveyard</a>
        <a class="next-button" href="#scene1">Escape the Cemetery</a>
    </div>

</section>
</body>
</html>
